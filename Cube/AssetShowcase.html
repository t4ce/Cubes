<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cube Nature Asset + Bird Builder</title>
<style>
  html,body{height:100%;margin:0;background:#f1eee1;font-family:Inter,system-ui,Arial,sans-serif;color:#222}
  #app{height:100%;display:grid;grid-template-rows:auto 1fr}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fbf9ef;border-bottom:1px solid #d8d3c3}
  button,select{font:inherit;padding:7px 10px;border:1px solid #bcb6a7;border-radius:8px;background:white;cursor:pointer}
  button:hover{background:#f3f3f3}
  #status{margin-left:auto;font-size:12px;opacity:.78;font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  button:disabled{opacity:.45;cursor:default}
  #animalControls{display:inline-flex;align-items:center;gap:9px}
  #animalControls label{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;cursor:pointer}
  #animalControls input{accent-color:#64785d}
  body[data-view-mode="asset"] #preset,
  body[data-view-mode="animal"] #animalPreset{border-color:#7d8d73;box-shadow:0 0 0 2px #84957922}
  select:focus-visible,button:focus-visible{outline:2px solid #6c8468;outline-offset:2px}
  #view{min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%}

</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

}
</script>
</head>

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function choose(a){return a[Math.floor(rnd()*a.length)]}

function clearTree(){
  for(const m of [...treeGroup.children]){
    treeGroup.remove(m);
    if(m.material) m.material.dispose();
  }
  occupied.clear();
  placed=[];
}

function cellKey(x,y,z){ return `${x},${y},${z}`; }

function cellsFor(gx,gy,gz,tier){
  const cells=[];
  for(let y=gy;y<gy+tier;y++)
    for(let x=gx;x<gx+tier;x++)
      for(let z=gz;z<gz+tier;z++) cells.push([x,y,z]);
  return cells;
}

function canOccupy(gx,gy,gz,tier){
  if(!Number.isInteger(tier) || tier < 1 || tier > MAX_CUBE_STEP) return false;
  if(!Number.isInteger(gx) || !Number.isInteger(gy) || !Number.isInteger(gz)) return false;
  for(const [x,y,z] of cellsFor(gx,gy,gz,tier)){
    if(occupied.has(cellKey(x,y,z))) return false;
  }
  return true;
}

// Tree placement: gx/gy/gz are integer coordinates of the cube's minimum
// occupied cell. Trees keep the strict non-overlapping 1x occupancy grid.
function cubeGrid(gx,gy,gz,tier,color,kind='cube'){
  tier=Math.round(tier);
  if(!canOccupy(gx,gy,gz,tier)) return false;

  const cx=gx+tier/2, cy=gy+tier/2, cz=gz+tier/2;
  const nominalSide=tier*GRID_UNIT;
  const renderSide=Math.max(0.001,nominalSide-GAP_WORLD);
  const m=new THREE.Mesh(cubeGeometry,material(color));
  m.name=`${kind}_${tier}x_${String(treeGroup.children.length).padStart(3,'0')}`;
  m.position.set(cx*GRID_UNIT,cy*GRID_UNIT,cz*GRID_UNIT);
  m.scale.setScalar(renderSide); // uniform only: never flat/stretched
  m.castShadow=m.receiveShadow=true;
  m.userData={
    kind,
    sizeTier:tier,
    placement:'grid',
    centerGrid:[cx,cy,cz],
    gridStart:[gx,gy,gz],
    gridUnit:GRID_UNIT,
    reservedCells:tier*tier*tier,
    gapRatioOfGridUnit:GAP,
    visualClipRatioOfGridUnit:0,
    colorRGB:color>>>0
  };
  treeGroup.add(m);

  for(const [x,y,z] of cellsFor(gx,gy,gz,tier)) occupied.add(cellKey(x,y,z));
  placed.push({center:[cx,cy,cz],gx,gy,gz,tier,color:color>>>0,kind});
  return true;
}

function column(gx,gz,tier,count,gy0,colorSet,kind='trunk'){
  for(let i=0;i<count;i++) cubeGrid(gx,gy0+i*tier,gz,tier,choose(colorSet),kind);
}

function stairBranch(gx,gy,gz,steps,dx,dz,tier=1){
  for(let i=1;i<=steps;i++) cubeGrid(gx+dx*i,gy+i,gz+dz*i,tier,choose(bark),'branch');
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Packs an ellipsoid on the strict 1x occupancy grid. Larger legal cubes are
// tried first; smaller cubes fill the remaining cells without overlap.
function blob(cx,cy,cz,rx,ry,rz,colorSet,kind='foliage',edgeNoise=0.10,maxTier=4){
  maxTier=Math.max(1,Math.min(MAX_CUBE_STEP,Math.round(maxTier)));
  const target=new Set();
  const minX=Math.floor(cx-rx), maxX=Math.ceil(cx+rx);
  const minY=Math.floor(cy-ry), maxY=Math.ceil(cy+ry);
  const minZ=Math.floor(cz-rz), maxZ=Math.ceil(cz+rz);
  for(let y=minY;y<=maxY;y++) for(let x=minX;x<=maxX;x++) for(let z=minZ;z<=maxZ;z++){
    const px=x+0.5, py=y+0.5, pz=z+0.5;
    const q=((px-cx)**2)/(rx*rx)+((py-cy)**2)/(ry*ry)+((pz-cz)**2)/(rz*rz);
    if(q<=1 && !(q>0.72 && rnd()<edgeNoise)) target.add(cellKey(x,y,z));
  }
  function blockFitsTarget(gx,gy,gz,tier){
    for(const [x,y,z] of cellsFor(gx,gy,gz,tier)){
      if(!target.has(cellKey(x,y,z)) || occupied.has(cellKey(x,y,z))) return false;
    }
    return true;
  }
  for(let tier=maxTier;tier>=1;tier--){
    const candidates=[];
    for(let y=minY;y<=maxY-tier+1;y++) for(let x=minX;x<=maxX-tier+1;x++) for(let z=minZ;z<=maxZ-tier+1;z++) candidates.push([x,y,z]);
    shuffle(candidates);
    const takeChance=tier===4?0.52:tier===3?0.62:tier===2?0.76:1;
    for(const [gx,gy,gz] of candidates){
      if(tier>1 && rnd()>takeChance) continue;
      if(blockFitsTarget(gx,gy,gz,tier)) cubeGrid(gx,gy,gz,tier,choose(colorSet),kind);
    }
  }
}

// CHESTS
// Four compact standalone loot containers. They obey the same strict 1x cell
// occupancy rules as every other asset. Loot is made from individual colored
// gem cubes; closed chests keep it recessed, while the two "almost closed"
// variants expose a one-cell seam beneath the lid.
const chestWood=[0x704228,0x805033,0x925f3d,0x5e3523];
const chestDarkWood=[0x493126,0x5a3a2b,0x6b4633,0x3b2922];
const chestRedWood=[0x67302f,0x7d3937,0x934643,0x542828];
const chestBrass=[0xb68835,0xd2a347,0xe2bd62];
const chestIron=[0x596067,0x6b737a,0x454b51];
const chestGold=[0xc69932,0xe1b84a,0xf0cf6c];
const gemLoot=[0x49b8ff,0x57d987,0xf05b71,0xc664ff,0xffd44a,0x44e2d0];

function chestShell({w,d,bodyH,lidH,gap=0,wood=chestWood,trim=chestBrass,bandXs=[],loot=3,feet=false}){
  const x0=-Math.floor(w/2);
  const z0=-Math.floor(d/2);
  const x1=x0+w-1;
  const z1=z0+d-1;
  const front=z1;

  // Hollow body: floor plus four walls. Trim replaces wood at selected bands.
  for(let y=0;y<bodyH;y++) for(let x=x0;x<=x1;x++) for(let z=z0;z<=z1;z++){
    const shell=y===0 || x===x0 || x===x1 || z===z0 || z===z1;
    if(!shell) continue;
    const isBand=bandXs.includes(x) || (z===front && y===bodyH-1);
    cubeGrid(x,y,z,1,choose(isBand?trim:wood),isBand?'chestTrim':'chest');
  }

  // Optional small feet keep medium chests visually weighty without enlarging
  // the whole body. They sit outside the hollow volume and remain grid-aligned.
  if(feet){
    for(const x of [x0,x1]) for(const z of [z0,z1]) cubeGrid(x,-1,z,1,choose(trim),'chestTrim');
  }

  // Recessed gem cubes. On an almost-closed chest the gap makes a few visible
  // through the seam; on a closed chest they are genuinely contained inside.
  const gemSpots=[
    [x0+2,bodyH,z0+2],[x1-2,bodyH,z1-2],[0,bodyH,z0+Math.floor(d/2)],
    [x0+3,bodyH,z1-2],[x1-3,bodyH,z0+2],[1,bodyH,z1-3]
  ];
  const gemY=gap>0?bodyH:Math.max(1,bodyH-1);
  for(let i=0;i<Math.min(loot,gemSpots.length);i++){
    const [gx,,gz]=gemSpots[i];
    cubeGrid(gx,gemY,gz,1,gemLoot[i%gemLoot.length],'gem');
  }

  // Chunky lid with a subtly stepped crown. gap=0 is closed; gap=1 is only
  // one cube-cell ajar, enough to hint at the loot without reading as open.
  const lidBase=bodyH+gap;
  for(let ly=0;ly<lidH;ly++){
    const inset=(ly===lidH-1 && lidH>1)?1:0;
    const lx0=x0+inset, lx1=x1-inset;
    const lz0=z0+inset, lz1=z1-inset;
    for(let x=lx0;x<=lx1;x++) for(let z=lz0;z<=lz1;z++){
      const top=ly===lidH-1;
      const rim=x===lx0 || x===lx1 || z===lz0 || z===lz1;
      if(!top && !rim) continue;
      const isBand=bandXs.includes(x) || z===front;
      cubeGrid(x,lidBase+ly,z,1,choose(isBand?trim:wood),isBand?'chestTrim':'chest');
    }
  }

  // Front clasp projects one cell from the body and makes the closed state
  // visually obvious even on the almost-closed variants.
  cubeGrid(0,Math.max(1,bodyH-2),front+1,1,choose(trim),'chestTrim');
  cubeGrid(0,Math.max(2,bodyH-1),front+1,1,choose(trim),'chestTrim');
}

// TOOLS — compact 3D silhouettes, roughly twice the vegetable cube budget.
// The local cell map lets metal collars replace handle cells without overlap.
const TOOL_PRESETS=['pickaxe','hatchet','hammer','spade','hoe','rake','sickle','wateringCan'];
const toolWood=[0x80502d,0x99623a,0xad7848];
const toolSteel=[0x647985,0x8295a0,0xa8b9bf];
const toolEdge=[0xbccdd0,0xd5e0dd];
const toolBrass=[0xb59343,0xd1b262,0xe1c788];
function toolShape(draw){
  const cells=new Map();
  const put=(x,y,z,palette=toolSteel,kind='toolHead')=>cells.set(cellKey(x,y,z),{x,y,z,palette,kind});
  const box=(x0,x1,y0,y1,z0,z1,palette=toolSteel,kind='toolHead')=>{
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) for(let z=z0;z<=z1;z++) put(x,y,z,palette,kind);
  };
  const handle=(height=11)=>box(-1,0,0,height-1,0,1,toolWood,'toolHandle');
  draw({put,box,handle});
  for(const c of cells.values()) cubeGrid(c.x,c.y,c.z,1,choose(c.palette),c.kind);
}
function pickaxe(){toolShape(({put,box,handle})=>{
  handle(10); box(-3,2,9,10,0,1);
  for(const side of [-1,1]){
    for(const z of [0,1]){put(side<0?-4:3,9,z);put(side<0?-5:4,8,z,toolEdge);}
  }
});}
function hatchet(){toolShape(({put,box,handle})=>{
  handle(10); box(-2,0,8,10,0,1); box(1,2,7,10,0,1);
  for(let y=7;y<=10;y++) put(3,y,0,toolEdge);
});}
function hammer(){toolShape(({box,handle})=>{
  handle(9); box(-3,2,8,10,0,1);
  box(-3,-3,8,10,0,1,toolEdge); box(2,2,8,10,0,1,toolEdge);
});}
function spade(){toolShape(({put,box})=>{
  box(-1,0,4,10,0,0,toolWood,'toolHandle');
  box(-2,1,1,4,-1,0); box(-1,0,0,0,-1,0,toolEdge);
  box(-2,1,13,13,0,0,toolWood,'toolHandle');
  for(const x of [-2,1]) box(x,x,10,12,0,0,toolWood,'toolHandle');
  box(-1,0,4,5,-1,0,toolBrass,'toolDetail');
});}
function hoe(){toolShape(({box,handle})=>{
  handle(11); box(-2,1,10,11,0,1); box(-2,1,9,10,2,3,toolEdge);
});}
function rake(){toolShape(({box,handle})=>{
  handle(10); box(-4,3,9,10,0,0);
  for(const x of [-4,-2,1,3]) box(x,x,11,13,0,0,toolEdge);
  box(-1,0,8,9,1,1,toolBrass,'toolDetail');
});}
function sickle(){toolShape(({put,box,handle})=>{
  handle(8); box(-1,1,8,9,0,1); box(1,2,10,12,0,1);
  box(-1,1,13,13,0,1); box(-3,-2,12,13,0,0,toolEdge);
  put(-4,11,0,toolEdge); put(-4,10,0,toolEdge);
});}
function wateringCan(){toolShape(({put,box})=>{
  // Hollow, open-topped small can with a loop handle and an upward spout.
  const green=[0x47775d,0x639477,0x83ae8b];
  for(let y=0;y<4;y++) for(let x=-2;x<2;x++) for(let z=-1;z<2;z++){
    if(y===0||x===-2||x===1||z===-1||z===1) put(x,y,z,green,'toolHead');
  }
  for(let y=1;y<=4;y++) put(-4,y,0,toolBrass,'toolDetail');
  for(const y of [1,4]) put(-3,y,0,toolBrass,'toolDetail');
  for(const c of [[2,1,0],[2,2,0],[3,2,0],[3,3,0],[4,3,0],[4,4,0],[5,4,0]]) put(...c,green,'toolHead');
  for(const z of [-1,0,1]) put(5,5,z,toolBrass,'toolDetail');
});}

// DYNAMIC PORTALS
// One portal material system can represent every legal 1/2/3-theme mix,
// Void, or the neutral generic Leave state. Standing is a grounded oval ring;
// Circle is a floating round ring. Both remain strict 1x-grid cube assets.
const dynamicPortalThemeMeta={
  1:{name:'Sky',color:0x63c7f2},
  2:{name:'Underground',color:0x3b2b34},
  3:{name:'black-hole',color:0x2d2438},
  4:{name:'white-hole',color:0xf4e8a6},
  5:{name:'Island',color:0x4eaf68},
  6:{name:'City',color:0xd76567},
  S:{name:'void',color:0xd83cff},
  L:{name:'generic',color:0xcbd5e1}
};
const dynamicPortalOpposing=new Set(['1-2','3-4','5-6']);

function dynamicPortalMixOptions(){
  const out=[];
  for(let a=1;a<=6;a++) out.push({ids:[a]});
  for(let a=1;a<=6;a++) for(let b=a+1;b<=6;b++){
    if(!dynamicPortalOpposing.has(`${a}-${b}`)) out.push({ids:[a,b]});
  }
  for(const a of [1,2]) for(const b of [3,4]) for(const c of [5,6]) out.push({ids:[a,b,c]});
  out.push({ids:['S']},{ids:['L']});
  return out;
}
function initDynamicPortalMixUi(){
  const select=document.getElementById('portalMix');
  if(!select || select.options.length) return;
  for(const {ids} of dynamicPortalMixOptions()){
    const option=document.createElement('option');
    option.value=ids.join(',');
    option.textContent=ids[0]==='S' ? 'Void' : ids[0]==='L' ? 'Generic' : ids.map(id=>dynamicPortalThemeMeta[id].name).join(' + ');
    select.appendChild(option);
  }
  select.value='1,3';
}
function currentDynamicPortalMix(){
  const raw=document.getElementById('portalMix')?.value || '1';
  return raw.split(',').map(v=>/^\d+$/.test(v)?Number(v):v);
}
function dynamicPortalMixIndex(u,v,count,salt=0){
  if(count<=1) return 0;
  const noise=Math.sin((u*12.9898+v*78.233+salt*31.17))*43758.5453;
  const jitter=(noise-Math.floor(noise)-0.5);
  if(count===2){
    const wobble=1.4*Math.sin(v*0.52+salt*0.71)+jitter*1.6;
    return u+v*0.16+wobble<0 ? 0 : 1;
  }
  let angle=Math.atan2(v,u)+Math.PI+(salt*0.73)%(Math.PI*2)+jitter*0.28;
  angle=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  return Math.min(2,Math.floor(angle/(Math.PI*2/3)));
}
function dynamicPortalColor(themeId,accent=false){
  const base=new THREE.Color(dynamicPortalThemeMeta[themeId].color);
  if(accent) base.lerp(new THREE.Color(0xffffff),themeId==='L'?0.50:0.30);
  return base.getHex();
}
function standalonePortalCells(mode){
  const cells=[];
  if(mode==='circle'){
    const cy=9;
    for(let y=1;y<=17;y++) for(let x=-8;x<=8;x++){
      const u=x/7.6, v=(y-cy)/7.6;
      const outer=u*u+v*v<=1.02;
      const inner=(x/4.8)**2+((y-cy)/4.8)**2<1;
      if(!outer || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y-cy,accent:z===0 && (Math.abs(u*u+v*v-1)<0.24)});
    }
  }else{
    const cy=10;
    for(let y=2;y<=18;y++) for(let x=-8;x<=8;x++){
      const outer=(x/7.7)**2+((y-cy)/8.1)**2<=1.03;
      const inner=(x/4.8)**2+((y-cy)/5.2)**2<1;
      if(!outer || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y-cy,accent:z===0 && ((Math.abs(x)>=6)||(y>=16))});
    }
    for(const sx of [-1,1]){
      for(let y=0;y<=3;y++) for(let x=(sx<0?-7:5);x<=(sx<0?-5:7);x++) for(const z of [-1,0]){
        cells.push({x,y,z,u:x,v:y-cy,accent:y===0});
      }
    }
  }
  const seen=new Set();
  return cells.filter(c=>{const k=`${c.x},${c.y},${c.z}`;if(seen.has(k))return false;seen.add(k);return true;});
}
function buildStandaloneDynamicPortal(mode){
  const ids=currentDynamicPortalMix();
  const cells=standalonePortalCells(mode);
  const salt=ids.reduce((n,id)=>n+(typeof id==='number'?id*17:id==='S'?97:131),mode==='circle'?41:19);
  for(const c of cells){
    const idx=dynamicPortalMixIndex(c.u,c.v,ids.length,salt);
    const themeId=ids[idx];
    cubeGrid(c.x,c.y,c.z,1,dynamicPortalColor(themeId,c.accent),c.accent?'portalAccent':'portal');
  }
}
function dynamicPortalStanding(){buildStandaloneDynamicPortal('standing')}
function dynamicPortalCircle(){buildStandaloneDynamicPortal('circle')}

// Portal assets: 19 grid cells tall = 3.8 world units, almost exactly 80% of
// the pine's 24-cell height. The frame uses exactly 460 visible 1x cubes,
// which sits inside the pine's normal ~414-511 cube complexity range.
const portalPalettes={
  sky:{main:[0x4aaad8,0x63c7f2,0x8bdcf7],accent:[0xd8f5ff,0xffffff]},
  underground:{main:[0x2f222a,0x3b2b34,0x493640],accent:[0x65505b,0x7a626f]},
  blackHole:{main:[0x211a29,0x2d2438,0x392e47],accent:[0x5a496d,0x705c86]},
  whiteHole:{main:[0xd8c96f,0xf4e8a6,0xfff5d1],accent:[0xffffff,0xffefad]},
  island:{main:[0x2f7d44,0x4eaf68,0x76c985],accent:[0xd5ef8d,0xf1ffd0]},
  city:{main:[0x9f4145,0xd76567,0xe58d8f],accent:[0xffc4b8,0xffeee7]},
  void:{main:[0x5b0d77,0x8f17b0,0xd83cff],accent:[0xff7aff,0xf6c2ff]},
  leave:{main:[0x68717f,0x9aa4b2,0xcbd5e1],accent:[0xffffff,0xe8edf3]}
};

function portalOpening(x,y){
  return (y<=11 && Math.abs(x)<=3) ||
    (y===12 && Math.abs(x)<=2) ||
    (y===13 && Math.abs(x)<=1) ||
    (y===14 && x===0);
}

function portalFrame(palette){
  // Two-cube-deep stepped arch body.
  for(let y=0;y<19;y++) for(let x=-7;x<=7;x++){
    if(portalOpening(x,y)) continue;
    for(const z of [-1,0]) cubeGrid(x,y,z,1,choose(palette.main),'portal');
  }

  // Front ribs / crest: 76 additional cubes, for exactly 460 total.
  for(let y=0;y<19;y++){
    for(const x of [-7,7]) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
    if(y%2===0 && y<=11){
      for(const x of [-4,4]) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
    }
  }
  for(const y of [15,18]) for(let x=-7;x<=7;x++) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
}

function skyPortal(){portalFrame(portalPalettes.sky)}
function undergroundPortal(){portalFrame(portalPalettes.underground)}
function blackHolePortal(){portalFrame(portalPalettes.blackHole)}
function whiteHolePortal(){portalFrame(portalPalettes.whiteHole)}
function islandPortal(){portalFrame(portalPalettes.island)}
function cityPortal(){portalFrame(portalPalettes.city)}
function voidPortal(){portalFrame(portalPalettes.void)}
function leavePortal(){portalFrame(portalPalettes.leave)}

// CUBES grid asset format v1, little-endian.
// Geometry is never duplicated: one 8-byte record describes each cube.
//
// 16-byte header:
//   magic[4]="CUBE", version:u8=1, flags:u8=0, gapPercent:u8=1,
//   recordSize:u8=8, cubeCount:u16, paletteCount:u8, maxTier:u8=4,
//   gridUnit:f32
// palette: RGBA8 x paletteCount
// cube record (8 bytes): gx:i8, gy:i8, gz:i8, size:u8,
//                        palette:u8, part:u8, flags:u8, reserved:u8
function makeCubesBinary(records=placed){
  if(!records.length) return null;
  const colors=[]; const colorIndex=new Map();
  for(const q of records){
    const k=q.color>>>0;
    if(!colorIndex.has(k)){ colorIndex.set(k,colors.length); colors.push(k); }
    if(q.gx < -128 || q.gx > 127 || q.gy < -128 || q.gy > 127 || q.gz < -128 || q.gz > 127){
      alert('Grid coordinate exceeds compact CUBES v1 i8 range.');
      return null;
    }
  }
  if(colors.length>255){ alert('Too many colors for compact palette.'); return null; }
  if(records.length>65535){ alert('Too many cubes for compact CUBES v1.'); return null; }

  const headerBytes=16, paletteBytes=colors.length*4, cubeBytes=records.length*8;
  const out=new ArrayBuffer(headerBytes+paletteBytes+cubeBytes);
  const dv=new DataView(out); let o=0;
  for(const c of [67,85,66,69]) dv.setUint8(o++,c); // CUBE
  dv.setUint8(o++,1); // version
  dv.setUint8(o++,0); // flags: strict grid/static
  dv.setUint8(o++,Math.round(GAP*100));
  dv.setUint8(o++,8); // cube record size
  dv.setUint16(o,records.length,true); o+=2;
  dv.setUint8(o++,colors.length);
  dv.setUint8(o++,MAX_CUBE_STEP);
  dv.setFloat32(o,GRID_UNIT,true); o+=4;

  for(const c of colors){
    dv.setUint8(o++,(c>>16)&255); dv.setUint8(o++,(c>>8)&255); dv.setUint8(o++,c&255); dv.setUint8(o++,255);
  }
  for(const q of records){
    dv.setInt8(o++,q.gx); dv.setInt8(o++,q.gy); dv.setInt8(o++,q.gz);
    dv.setUint8(o++,q.tier);
    dv.setUint8(o++,colorIndex.get(q.color>>>0));
    dv.setUint8(o++,PART_IDS.get(q.kind) ?? 0);
    dv.setUint8(o++,0); // flags reserved
    dv.setUint8(o++,0); // reserved
  }
  return out;
}

// Shared integer-cell authoring. This is the *bind pose*: wings extended,

  const pick=palette=>Array.isArray(palette)?palette[Math.floor(rng()*palette.length)]:palette;
  const put=(x,y,z,part,palette,kind='birdBody')=>{

  };

    if(((x+.5)/rx)**2+((y+.5-4.8)/ry)**2+((z+.5)/rz)**2<=1){

    put(x,4,-3-i,'tail',i>0?spec.tip:spec.main,'birdTail');
    if(spec.name==='Crow' && i<2) for(const sx of [-2,1]) put(sx,4,-3-i,'tail',spec.tip,'birdTail');
  }

    for(let y=1;y<=2;y++) put(x,y,0,'feet',spec.feet,'birdFeet');

    mid2.x=clamp(mid2.x+(this.random()-.5)*7);mid2.z=clamp(mid2.z+(this.random()-.5)*7);mid2.y=altitude+.3;
    const lead=start.clone().addScaledVector(heading,2.8);lead.x=clamp(lead.x);lead.z=clamp(lead.z);
    const beforeEnd=end.clone().addScaledVector(approach,-2.8);
    this.cruise=new THREE.CatmullRomCurve3([start.clone(),lead,mid1,mid2,beforeEnd,end],false,'centripetal');
    this.cruise.arcLengthDivisions=240;this.cruise.updateArcLengths();
    this.cruiseSpeed=this.cruise.getLength()/BIRD_TIMING.fly;
    const tangent=this.cruise.getTangentAt(1);
    this.landingCurve=new THREE.CubicBezierCurve3(end.clone(),end.clone().addScaledVector(tangent,this.cruiseSpeed*BIRD_TIMING.landing/3),this.landingTarget.clone(),this.landingTarget.clone());
  }
  nextState(){
    if(this.state==='fly') this.state='landing';
    else if(this.state==='landing'){
      this.state='sit';this.position.copy(this.landingTarget);this.bank=0;
    }else if(this.state==='sit'){
      const start=this.position.clone();
      // Take off toward the interior, with variation, never toward a nearby edge.
      const direction=new THREE.Vector3(-start.x+(this.random()-.5)*8,0,-start.z+(this.random()-.5)*8);
      if(direction.lengthSq()<.01) direction.set(1,0,0);direction.normalize();
      const end=start.clone().addScaledVector(direction,3);end.y=this.ground.top+4.3;
      this.planCruise(end,direction);
      const tangent=this.cruise.getTangentAt(0);
      this.takeoffCurve=new THREE.CubicBezierCurve3(start,start.clone(),end.clone().addScaledVector(tangent,-this.cruiseSpeed*BIRD_TIMING.takeoff/3),end);
      this.state='takeoff';
    }else{this.state='fly';this.cycles++;}
    this.elapsed=0;
  }
  update(dt){
    // Substeps keep turns stable for low FPS and for integrations using a larger
    // delta. State boundaries preserve excess time rather than losing it.
    let remaining=Math.max(0,dt);
    while(remaining>1e-8){
      const step=Math.min(remaining,1/30,BIRD_TIMING[this.state]-this.elapsed);
      this.elapsed+=step;this.totalElapsed+=step;remaining-=step;
      this.evaluate(step);
      if(this.elapsed>=BIRD_TIMING[this.state]-1e-7) this.nextState();
    }
  }
  evaluate(dt,initial=false){
    const t=THREE.MathUtils.clamp(this.elapsed/BIRD_TIMING[this.state],0,1);
    let moving=true;
    if(this.state==='fly'){
      this.cruise.getPointAt(t,this.position);this.cruise.getTangentAt(t,this.tangent);this.air=1;
    }else if(this.state==='landing'){
      this.landingCurve.getPoint(t,this.position);this.landingCurve.getTangent(Math.min(t,.9999),this.tangent);this.air=1-smooth5(t);
    }else if(this.state==='takeoff'){
      this.takeoffCurve.getPoint(t,this.position);this.takeoffCurve.getTangent(Math.max(t,.0001),this.tangent);this.air=smooth5(t);
    }else{this.air=0;moving=false;}
    if(moving && Math.hypot(this.tangent.x,this.tangent.z)>1e-7){
      const targetYaw=Math.atan2(this.tangent.x,this.tangent.z);
      const difference=Math.atan2(Math.sin(targetYaw-this.yaw),Math.cos(targetYaw-this.yaw));
      this.yaw+=difference*(initial?1:1-Math.exp(-8*dt));
      const turnBank=THREE.MathUtils.clamp(-difference*.65,-.18,.18)*this.air;
      this.bank=THREE.MathUtils.lerp(this.bank,turnBank,initial?1:1-Math.exp(-5*dt));
      this.direction.set(Math.sin(this.yaw),0,Math.cos(this.yaw));
    }
    const root=this.rig.root;
    root.position.copy(this.position);
    root.position.y+=.045*Math.sin(this.totalElapsed*3.2)*this.air;
    // Body banking/pitch relax completely before feet touch the surface.
    root.rotation.set(.035*this.air,this.yaw,this.bank*this.air,'YXZ');
    this.rig.pose(this.air,this.totalElapsed);
  }
  snapshot(){return {species:this.rig.spec.name,cubes:this.rig.records.length,state:this.state,
    elapsed:this.elapsed,remaining:Math.max(0,BIRD_TIMING[this.state]-this.elapsed),air:this.air,cycles:this.cycles,
    position:this.position.toArray(),landingTarget:this.landingTarget.toArray(),groundTop:this.ground.top};}
}

const host=window.CUBE_NATURE_THEME_HOST;
const animalSelect=document.getElementById('animalPreset');
const followInput=document.getElementById('followBird');
const pauseButton=document.getElementById('pauseBird');
let rig=null,controller=null,seed=301,paused=false,active=false,statusClock=0;
let shadow=null,shadowTexture=null,shadowMaterial=null;
const target=new THREE.Vector3(),cameraShift=new THREE.Vector3();

function makeShadow(){
  if(shadow) return;
  const canvas=document.createElement('canvas');canvas.width=canvas.height=64;
  const context=canvas.getContext('2d'),gradient=context.createRadialGradient(32,32,3,32,32,31);
  gradient.addColorStop(0,'rgba(36,31,28,.32)');gradient.addColorStop(1,'rgba(36,31,28,0)');
  context.fillStyle=gradient;context.fillRect(0,0,64,64);
  shadowTexture=new THREE.CanvasTexture(canvas);
  shadowMaterial=new THREE.MeshBasicMaterial({map:shadowTexture,transparent:true,depthWrite:false,opacity:.8});
  shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.3,2.3),shadowMaterial);shadow.name='BirdContactShadow_DisplayOnly';
  shadow.rotation.x=-Math.PI/2;shadow.renderOrder=2;shadow.userData.displayOnly=true;host.scene.add(shadow);
}
function frameBird(){
  if(!rig) return;
  const position=rig.root.position;
  host.controls.target.set(position.x,position.y+1,position.z);
  host.camera.position.copy(host.controls.target).add(new THREE.Vector3(5.4,3.5,6.8));
  host.camera.near=.02;host.camera.far=200;host.camera.updateProjectionMatrix();host.controls.update();
}
function frameHabitat(){
  host.controls.target.set(0,2.2,0);host.camera.position.set(10,8,12);
  host.camera.near=.03;host.camera.far=200;host.camera.updateProjectionMatrix();host.controls.update();
}
function updateBirdStatus(){
  if(!active || !controller) return;
  const state=controller.snapshot();
  const labels={fly:'Flying',landing:'Landing',sit:'Sitting',takeoff:'Taking off'};
  document.getElementById('status').textContent=`${state.species} · ${state.cubes} cubes · ${paused?'Paused · ':''}${labels[state.state]} · ${state.remaining.toFixed(1)}s`;
}
function showAnimal(species,{rebuild=false}={}){
  if(!BIRD_SPECIES[species]) return;
  if(!host.getCubeGeometry()) return;
  animalSelect.value=species;
  window.dispatchEvent(new CustomEvent('cube-nature-view-mode',{detail:{mode:'animal'}}));
  const ground=host.getAnimalGround();
  if(!rig || rig.root.userData.species!==species || rebuild || controller.ground.id!==ground.id){
    if(rig) rig.dispose();
    seed=(seed+1)>>>0;rig=makeBirdRig(host,species,seed);host.scene.add(rig.root);
    controller=new BirdFlightController(rig,ground,seed+91);paused=false;
  }
  active=true;rig.root.visible=true;makeShadow();shadow.visible=true;
  pauseButton.textContent=paused?'Resume':'Pause';pauseButton.setAttribute('aria-pressed',String(paused));
  if(followInput.checked) frameBird();else frameHabitat();
  updateBirdStatus();updateShadow();
}
function updateShadow(){
  if(!rig||!shadow) return;
  shadow.position.set(rig.root.position.x,controller.ground.top+.006,rig.root.position.z);
  const altitude=Math.max(0,rig.root.position.y-controller.ground.top);
  shadow.scale.setScalar(1+altitude*.11);shadowMaterial.opacity=.9/(1+altitude*.25);
}
function setPaused(value){
  paused=!!value;pauseButton.textContent=paused?'Resume':'Pause';pauseButton.setAttribute('aria-pressed',String(paused));updateBirdStatus();
}
window.addEventListener('cube-nature-view-mode',event=>{
  if(event.detail?.mode!=='animal'){
    active=false;if(rig)rig.root.visible=false;if(shadow)shadow.visible=false;
  }
});
animalSelect.addEventListener('change',()=>{
  if(animalSelect.value) showAnimal(animalSelect.value);
  else host.showAssetPreview();
});
for(const event of ['pointerdown','focus']) animalSelect.addEventListener(event,()=>{
  if(animalSelect.value && !active) showAnimal(animalSelect.value);
});
window.addEventListener('cube-nature-geometry-ready',()=>{
  if(animalSelect.value) showAnimal(animalSelect.value);
});
pauseButton.addEventListener('click',()=>setPaused(!paused));
followInput.addEventListener('change',()=>{if(!active)return;if(followInput.checked)frameBird();else frameHabitat();});
host.regenerateAnimal=()=>showAnimal(animalSelect.value,{rebuild:true});
host.exportAnimalCubes=()=>{
  if(!rig) return;
  host.downloadCubeRecords(rig.records,`cube_nature_${rig.root.userData.species}_bind_pose.cubes`);
};
host.onFrame.add(dt=>{
  if(!active||!controller)return;
  if(!paused)controller.update(dt);
  updateShadow();
  if(followInput.checked){
    target.copy(rig.root.position);target.y+=1;
    cameraShift.subVectors(target,host.controls.target).multiplyScalar(1-Math.exp(-7*dt));
    host.camera.position.add(cameraShift);host.controls.target.add(cameraShift);
  }
  statusClock+=dt;if(statusClock>.1){statusClock=0;updateBirdStatus();}
});
// Small integration/testing surface: the controller is also usable with a
// custom clock; the production renderer still owns the single animation loop.
window.CUBE_NATURE_ANIMALS={species:BIRD_SPECIES,timing:BIRD_TIMING,makeBirdCells,
  select:showAnimal,setPaused,getState:()=>controller?.snapshot()||null,
  get controller(){return controller;},get rig(){return rig;}};
</script>
