<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cube Nature Builder</title>
<style>
  html,body{height:100%;margin:0;background:#f1eee1;font-family:Inter,system-ui,Arial,sans-serif;color:#222}
  #app{height:100%;display:grid;grid-template-rows:auto 1fr}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fbf9ef;border-bottom:1px solid #d8d3c3}
  button,select{font:inherit;padding:7px 10px;border:1px solid #bcb6a7;border-radius:8px;background:white;cursor:pointer}
  button:hover{background:#f3f3f3}
  #status{margin-left:auto;font-size:12px;opacity:.7}
  #view{min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%}


  /* World-theme picker is intentionally isolated from the asset controls. */
  #worldThemeUi{position:relative}
  #worldThemeUi details{position:relative}
  #worldThemeUi summary{list-style:none;display:flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border:1px solid #bcb6a7;border-radius:8px;background:#fff;cursor:pointer;user-select:none;white-space:nowrap}
  #worldThemeUi summary::-webkit-details-marker{display:none}
  #worldThemeUi details[open] summary{background:#f4f2e9}
  .world-summary-id{font-weight:800;font-variant-numeric:tabular-nums}
  .world-summary-label{font-size:12px;opacity:.72}
  .world-summary-dots{display:flex;gap:3px}
  .world-dot{width:10px;height:10px;border-radius:3px;border:1px solid #0002;box-shadow:inset 0 0 0 1px #fff3}
  .world-picker-panel{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:min(520px,calc(100vw - 24px));max-height:min(68vh,650px);overflow:auto;padding:8px;background:#fbfaf5;border:1px solid #c9c3b4;border-radius:11px;box-shadow:0 14px 35px #0002}
  .world-pair-note{padding:7px 8px 9px;font-size:11px;line-height:1.4;color:#5c584f;border-bottom:1px solid #ddd7c9;margin-bottom:5px}
  .world-section{padding:7px 8px 4px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#817a6d}
  .world-row{width:100%;display:grid;grid-template-columns:38px 60px 92px 1fr;gap:8px;align-items:center;padding:7px 8px;border:0;border-radius:7px;background:transparent;text-align:left;cursor:pointer}
  .world-row:hover{background:#f0eee5}
  .world-row.active{background:#e8e4d8;box-shadow:inset 0 0 0 1px #c8c1b2}
  .world-id{font-weight:800;font-variant-numeric:tabular-nums}
  .world-kind{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#827a6d}
  .world-rubik{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#746e63;white-space:nowrap}
  .world-face-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:7px 8px;margin:0 0 5px;border-bottom:1px solid #ddd7c9;background:#f5f2e8}
  .world-face{display:flex;align-items:center;gap:5px;min-width:0;padding:4px 6px;border:1px solid #ddd6c7;border-radius:7px;background:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .world-face.center{grid-column:1/-1;justify-content:center}
  .world-face strong{min-width:14px;font-size:9px;text-transform:uppercase;color:#766f63}
  .world-face.unassigned{opacity:.45}
  .world-face .world-dot{flex:0 0 auto;width:8px;height:8px}
  .world-theme-list{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
  .world-chip{display:inline-flex;align-items:center;gap:5px;min-width:0;padding:3px 6px 3px 4px;border:1px solid #d9d3c5;border-radius:999px;background:#fff;font-size:11px;white-space:nowrap}
  .world-chip b{font-size:10px;min-width:13px;text-align:center}
  .world-chip .world-dot{width:9px;height:9px;border-radius:50%}
  @media(max-width:720px){.world-picker-panel{position:fixed;left:8px;right:8px;top:58px;width:auto;max-height:72vh}.world-row{grid-template-columns:34px 52px 1fr}.world-rubik{display:none}.world-face-map{grid-template-columns:repeat(2,minmax(0,1fr))}.world-summary-label{display:none}}
</style>

    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        <option value="forkedBush">Forked shrub</option>
        <option value="smallBerryBush">Small berry bush</option>
      </optgroup>

        <option value="travelerChest">Traveler chest</option>
        <option value="gemChest">Gem chest</option>
        <option value="ironboundChest">Ironbound chest</option>
        <option value="royalChest">Royal chest</option>
      </optgroup>

        <option value="chilliPepper">Chilli pepper</option>
        <option value="banana">Banana</option>
        <option value="carrot">Carrot</option>
        <option value="eggplant">Eggplant</option>
        <option value="cornCob">Corn</option>
        <option value="pumpkin">Pumpkin</option>
        <option value="radish">Radish</option>

        <option value="dynamicPortalStanding">Dynamic portal · Standing</option>
        <option value="dynamicPortalCircle">Dynamic portal · Circle</option>
      </optgroup>
    </select>
    <select id="portalMix" aria-label="Dynamic portal theme mix" title="Dynamic portal theme mix" hidden></select>
    <button id="regen">New variant</button>
    <button id="exportCubes">Export CUBES</button>
    <span id="status">loading cube…</span>
  </div>
  <div id="view"></div>
</div>

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
let rnd = mulberry32(seed);
function choose(a){return a[Math.floor(rnd()*a.length)]}

function material(color){
  return new THREE.MeshStandardMaterial({color,roughness:0.88,metalness:0,flatShading:true});
}

function clearTree(){
  for(const m of [...treeGroup.children]){
    treeGroup.remove(m);
    if(m.material) m.material.dispose();
  }
  occupied.clear();
  placed=[];
}

function cellKey(x,y,z){ return `${x},${y},${z}`; }

function cellsFor(gx,gy,gz,tier){
  const cells=[];
  for(let y=gy;y<gy+tier;y++)
    for(let x=gx;x<gx+tier;x++)
      for(let z=gz;z<gz+tier;z++) cells.push([x,y,z]);
  return cells;
}

function canOccupy(gx,gy,gz,tier){
  if(!Number.isInteger(tier) || tier < 1 || tier > MAX_CUBE_STEP) return false;
  if(!Number.isInteger(gx) || !Number.isInteger(gy) || !Number.isInteger(gz)) return false;
  for(const [x,y,z] of cellsFor(gx,gy,gz,tier)){
    if(occupied.has(cellKey(x,y,z))) return false;
  }
  return true;
}

// Tree placement: gx/gy/gz are integer coordinates of the cube's minimum
// occupied cell. Trees keep the strict non-overlapping 1x occupancy grid.
function cubeGrid(gx,gy,gz,tier,color,kind='cube'){
  tier=Math.round(tier);
  if(!canOccupy(gx,gy,gz,tier)) return false;

  const cx=gx+tier/2, cy=gy+tier/2, cz=gz+tier/2;
  const nominalSide=tier*GRID_UNIT;
  const renderSide=Math.max(0.001,nominalSide-GAP_WORLD);
  const m=new THREE.Mesh(cubeGeometry,material(color));
  m.name=`${kind}_${tier}x_${String(treeGroup.children.length).padStart(3,'0')}`;
  m.position.set(cx*GRID_UNIT,cy*GRID_UNIT,cz*GRID_UNIT);
  m.scale.setScalar(renderSide); // uniform only: never flat/stretched
  m.castShadow=m.receiveShadow=true;
  m.userData={
    kind,
    sizeTier:tier,
    placement:'grid',
    centerGrid:[cx,cy,cz],
    gridStart:[gx,gy,gz],
    gridUnit:GRID_UNIT,
    reservedCells:tier*tier*tier,
    gapRatioOfGridUnit:GAP,
    visualClipRatioOfGridUnit:0,
    colorRGB:color>>>0
  };
  treeGroup.add(m);

  for(const [x,y,z] of cellsFor(gx,gy,gz,tier)) occupied.add(cellKey(x,y,z));
  placed.push({center:[cx,cy,cz],gx,gy,gz,tier,color:color>>>0,kind});
  return true;
}

function column(gx,gz,tier,count,gy0,colorSet,kind='trunk'){
  for(let i=0;i<count;i++) cubeGrid(gx,gy0+i*tier,gz,tier,choose(colorSet),kind);
}

function stairBranch(gx,gy,gz,steps,dx,dz,tier=1){
  for(let i=1;i<=steps;i++) cubeGrid(gx+dx*i,gy+i,gz+dz*i,tier,choose(bark),'branch');
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Packs an ellipsoid on the strict 1x occupancy grid. Larger legal cubes are
// tried first; smaller cubes fill the remaining cells without overlap.
function blob(cx,cy,cz,rx,ry,rz,colorSet,kind='foliage',edgeNoise=0.10,maxTier=4){
  maxTier=Math.max(1,Math.min(MAX_CUBE_STEP,Math.round(maxTier)));
  const target=new Set();
  const minX=Math.floor(cx-rx), maxX=Math.ceil(cx+rx);
  const minY=Math.floor(cy-ry), maxY=Math.ceil(cy+ry);
  const minZ=Math.floor(cz-rz), maxZ=Math.ceil(cz+rz);
  for(let y=minY;y<=maxY;y++) for(let x=minX;x<=maxX;x++) for(let z=minZ;z<=maxZ;z++){
    const px=x+0.5, py=y+0.5, pz=z+0.5;
    const q=((px-cx)**2)/(rx*rx)+((py-cy)**2)/(ry*ry)+((pz-cz)**2)/(rz*rz);
    if(q<=1 && !(q>0.72 && rnd()<edgeNoise)) target.add(cellKey(x,y,z));
  }
  function blockFitsTarget(gx,gy,gz,tier){
    for(const [x,y,z] of cellsFor(gx,gy,gz,tier)){
      if(!target.has(cellKey(x,y,z)) || occupied.has(cellKey(x,y,z))) return false;
    }
    return true;
  }
  for(let tier=maxTier;tier>=1;tier--){
    const candidates=[];
    for(let y=minY;y<=maxY-tier+1;y++) for(let x=minX;x<=maxX-tier+1;x++) for(let z=minZ;z<=maxZ-tier+1;z++) candidates.push([x,y,z]);
    shuffle(candidates);
    const takeChance=tier===4?0.52:tier===3?0.62:tier===2?0.76:1;
    for(const [gx,gy,gz] of candidates){
      if(tier>1 && rnd()>takeChance) continue;
      if(blockFitsTarget(gx,gy,gz,tier)) cubeGrid(gx,gy,gz,tier,choose(colorSet),kind);
    }
  }
}

// CHESTS
// Four compact standalone loot containers. They obey the same strict 1x cell
// occupancy rules as every other asset. Loot is made from individual colored
// gem cubes; closed chests keep it recessed, while the two "almost closed"
// variants expose a one-cell seam beneath the lid.
const chestWood=[0x704228,0x805033,0x925f3d,0x5e3523];
const chestDarkWood=[0x493126,0x5a3a2b,0x6b4633,0x3b2922];
const chestRedWood=[0x67302f,0x7d3937,0x934643,0x542828];
const chestBrass=[0xb68835,0xd2a347,0xe2bd62];
const chestIron=[0x596067,0x6b737a,0x454b51];
const chestGold=[0xc69932,0xe1b84a,0xf0cf6c];
const gemLoot=[0x49b8ff,0x57d987,0xf05b71,0xc664ff,0xffd44a,0x44e2d0];

function chestShell({w,d,bodyH,lidH,gap=0,wood=chestWood,trim=chestBrass,bandXs=[],loot=3,feet=false}){
  const x0=-Math.floor(w/2);
  const z0=-Math.floor(d/2);
  const x1=x0+w-1;
  const z1=z0+d-1;
  const front=z1;

  // Hollow body: floor plus four walls. Trim replaces wood at selected bands.
  for(let y=0;y<bodyH;y++) for(let x=x0;x<=x1;x++) for(let z=z0;z<=z1;z++){
    const shell=y===0 || x===x0 || x===x1 || z===z0 || z===z1;
    if(!shell) continue;
    const isBand=bandXs.includes(x) || (z===front && y===bodyH-1);
    cubeGrid(x,y,z,1,choose(isBand?trim:wood),isBand?'chestTrim':'chest');
  }

  // Optional small feet keep medium chests visually weighty without enlarging
  // the whole body. They sit outside the hollow volume and remain grid-aligned.
  if(feet){
    for(const x of [x0,x1]) for(const z of [z0,z1]) cubeGrid(x,-1,z,1,choose(trim),'chestTrim');
  }

  // Recessed gem cubes. On an almost-closed chest the gap makes a few visible
  // through the seam; on a closed chest they are genuinely contained inside.
  const gemSpots=[
    [x0+2,bodyH,z0+2],[x1-2,bodyH,z1-2],[0,bodyH,z0+Math.floor(d/2)],
    [x0+3,bodyH,z1-2],[x1-3,bodyH,z0+2],[1,bodyH,z1-3]
  ];
  const gemY=gap>0?bodyH:Math.max(1,bodyH-1);
  for(let i=0;i<Math.min(loot,gemSpots.length);i++){
    const [gx,,gz]=gemSpots[i];
    cubeGrid(gx,gemY,gz,1,gemLoot[i%gemLoot.length],'gem');
  }

  // Chunky lid with a subtly stepped crown. gap=0 is closed; gap=1 is only
  // one cube-cell ajar, enough to hint at the loot without reading as open.
  const lidBase=bodyH+gap;
  for(let ly=0;ly<lidH;ly++){
    const inset=(ly===lidH-1 && lidH>1)?1:0;
    const lx0=x0+inset, lx1=x1-inset;
    const lz0=z0+inset, lz1=z1-inset;
    for(let x=lx0;x<=lx1;x++) for(let z=lz0;z<=lz1;z++){
      const top=ly===lidH-1;
      const rim=x===lx0 || x===lx1 || z===lz0 || z===lz1;
      if(!top && !rim) continue;
      const isBand=bandXs.includes(x) || z===front;
      cubeGrid(x,lidBase+ly,z,1,choose(isBand?trim:wood),isBand?'chestTrim':'chest');
    }
  }

  // Front clasp projects one cell from the body and makes the closed state
  // visually obvious even on the almost-closed variants.
  cubeGrid(0,Math.max(1,bodyH-2),front+1,1,choose(trim),'chestTrim');
  cubeGrid(0,Math.max(2,bodyH-1),front+1,1,choose(trim),'chestTrim');
}

  ].forEach((c,i)=>cubeGrid(...c,1,i<6?choose(radishBulb):choose([0xf5d0d8,0xf8bcc8,0xffffff]),'veggie'));
}

function cucumber(){
  [
    [-6,1,0],[-5,1,0],[-4,1,0],[-3,1,0],[-2,1,0],[-1,2,0],[0,2,0],[1,2,0],[2,2,0],[3,3,0],[4,3,0],[5,3,0],[6,4,0],

// DYNAMIC PORTALS
// One portal material system can represent every legal 1/2/3-theme mix,
// Void, or the neutral generic Leave state. Standing is a grounded oval ring;
// Circle is a floating round ring. Both remain strict 1x-grid cube assets.
const dynamicPortalThemeMeta={
  1:{name:'Sky',color:0x63c7f2},
  2:{name:'Underground',color:0x7a4b30},
  3:{name:'black-hole',color:0x25153d},
  4:{name:'white-hole',color:0xf4e8a6},
  5:{name:'Island',color:0x4eaf68},
  6:{name:'City',color:0xd76567},
  S:{name:'void',color:0xd83cff},
  L:{name:'generic',color:0xcbd5e1}
};
const dynamicPortalOpposing=new Set(['1-2','3-4','5-6']);

function dynamicPortalMixOptions(){
  const out=[];
  for(let a=1;a<=6;a++) out.push({ids:[a]});
  for(let a=1;a<=6;a++) for(let b=a+1;b<=6;b++){
    if(!dynamicPortalOpposing.has(`${a}-${b}`)) out.push({ids:[a,b]});
  }
  for(const a of [1,2]) for(const b of [3,4]) for(const c of [5,6]) out.push({ids:[a,b,c]});
  out.push({ids:['S']},{ids:['L']});
  return out;
}
function initDynamicPortalMixUi(){
  const select=document.getElementById('portalMix');
  if(!select || select.options.length) return;
  for(const {ids} of dynamicPortalMixOptions()){
    const option=document.createElement('option');
    option.value=ids.join(',');
    option.textContent=ids[0]==='S' ? 'Void' : ids[0]==='L' ? 'Generic' : ids.map(id=>dynamicPortalThemeMeta[id].name).join(' + ');
    select.appendChild(option);
  }
  select.value='1,3';
}
function currentDynamicPortalMix(){
  const raw=document.getElementById('portalMix')?.value || '1';
  return raw.split(',').map(v=>/^\d+$/.test(v)?Number(v):v);
}
function dynamicPortalMixIndex(u,v,count,salt=0){
  if(count<=1) return 0;
  const noise=Math.sin((u*12.9898+v*78.233+salt*31.17))*43758.5453;
  const jitter=(noise-Math.floor(noise)-0.5);
  if(count===2){
    const wobble=1.4*Math.sin(v*0.52+salt*0.71)+jitter*1.6;
    return u+v*0.16+wobble<0 ? 0 : 1;
  }
  let angle=Math.atan2(v,u)+Math.PI+(salt*0.73)%(Math.PI*2)+jitter*0.28;
  angle=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  return Math.min(2,Math.floor(angle/(Math.PI*2/3)));
}
function dynamicPortalColor(themeId,accent=false){
  const base=new THREE.Color(dynamicPortalThemeMeta[themeId].color);
  if(accent) base.lerp(new THREE.Color(0xffffff),themeId==='L'?0.50:0.30);
  return base.getHex();
}
function standalonePortalCells(mode){
  const cells=[];
  if(mode==='circle'){
    const cy=9;
    for(let y=1;y<=17;y++) for(let x=-8;x<=8;x++){
      const u=x/7.6, v=(y-cy)/7.6;
      const outer=u*u+v*v<=1.02;
      const inner=(x/4.8)**2+((y-cy)/4.8)**2<1;
      if(!outer || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y-cy,accent:z===0 && (Math.abs(u*u+v*v-1)<0.24)});
    }
  }else{
    const cy=10;
    for(let y=2;y<=18;y++) for(let x=-8;x<=8;x++){
      const outer=(x/7.7)**2+((y-cy)/8.1)**2<=1.03;
      const inner=(x/4.8)**2+((y-cy)/5.2)**2<1;
      if(!outer || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y-cy,accent:z===0 && ((Math.abs(x)>=6)||(y>=16))});
    }
    for(const sx of [-1,1]){
      for(let y=0;y<=3;y++) for(let x=(sx<0?-7:5);x<=(sx<0?-5:7);x++) for(const z of [-1,0]){
        cells.push({x,y,z,u:x,v:y-cy,accent:y===0});
      }
    }
  }
  const seen=new Set();
  return cells.filter(c=>{const k=`${c.x},${c.y},${c.z}`;if(seen.has(k))return false;seen.add(k);return true;});
}
function buildStandaloneDynamicPortal(mode){
  const ids=currentDynamicPortalMix();
  const cells=standalonePortalCells(mode);
  const salt=ids.reduce((n,id)=>n+(typeof id==='number'?id*17:id==='S'?97:131),mode==='circle'?41:19);
  for(const c of cells){
    const idx=dynamicPortalMixIndex(c.u,c.v,ids.length,salt);
    const themeId=ids[idx];
    cubeGrid(c.x,c.y,c.z,1,dynamicPortalColor(themeId,c.accent),c.accent?'portalAccent':'portal');
  }
}
function dynamicPortalStanding(){buildStandaloneDynamicPortal('standing')}
function dynamicPortalCircle(){buildStandaloneDynamicPortal('circle')}

// Portal assets: 19 grid cells tall = 3.8 world units, almost exactly 80% of
// the pine's 24-cell height. The frame uses exactly 460 visible 1x cubes,
// which sits inside the pine's normal ~414-511 cube complexity range.
const portalPalettes={
  sky:{main:[0x4aaad8,0x63c7f2,0x8bdcf7],accent:[0xd8f5ff,0xffffff]},
  underground:{main:[0x5a321f,0x7a4b30,0x9a6a47],accent:[0xc69a72,0xe1c2a4]},
  blackHole:{main:[0x12091f,0x25153d,0x3c1f64],accent:[0x9149d1,0xd48aff]},
  whiteHole:{main:[0xd8c96f,0xf4e8a6,0xfff5d1],accent:[0xffffff,0xffefad]},
  island:{main:[0x2f7d44,0x4eaf68,0x76c985],accent:[0xd5ef8d,0xf1ffd0]},
  city:{main:[0x9f4145,0xd76567,0xe58d8f],accent:[0xffc4b8,0xffeee7]},

function portalOpening(x,y){
  return (y<=11 && Math.abs(x)<=3) ||
    (y===12 && Math.abs(x)<=2) ||
    (y===13 && Math.abs(x)<=1) ||
    (y===14 && x===0);
}

function portalFrame(palette){
  // Two-cube-deep stepped arch body.
  for(let y=0;y<19;y++) for(let x=-7;x<=7;x++){
    if(portalOpening(x,y)) continue;
    for(const z of [-1,0]) cubeGrid(x,y,z,1,choose(palette.main),'portal');
  }

  // Front ribs / crest: 76 additional cubes, for exactly 460 total.
  for(let y=0;y<19;y++){
    for(const x of [-7,7]) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
    if(y%2===0 && y<=11){
      for(const x of [-4,4]) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
    }
  }
  for(const y of [15,18]) for(let x=-7;x<=7;x++) cubeGrid(x,y,1,1,choose(palette.accent),'portalAccent');
}

async function loadEmbeddedCube(){
  const raw=atob(EMBEDDED_CUBE_GLB);
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  new GLTFLoader().parse(bytes.buffer,'',(gltf)=>{
    let sourceMesh=null;
    gltf.scene.traverse(o=>{if(!sourceMesh && o.isMesh) sourceMesh=o;});
    if(!sourceMesh) throw new Error('No mesh found in embedded GLB');
    cubeGeometry=sourceMesh.geometry.clone();
    cubeGeometry.computeBoundingBox();
    const box=cubeGeometry.boundingBox;
    const c=new THREE.Vector3(); const s=new THREE.Vector3();
    box.getCenter(c); box.getSize(s);
    cubeGeometry.translate(-c.x,-c.y,-c.z);
    const maxSide=Math.max(s.x,s.y,s.z);
    cubeGeometry.scale(1/maxSide,1/maxSide,1/maxSide);
    cubeGeometry.computeVertexNormals();
    status.textContent='cube loaded';
    build();
    window.dispatchEvent(new Event('cube-nature-geometry-ready'));
  },err=>{console.error(err);status.textContent='failed to load cube';});
}

// CUBES grid asset format v1, little-endian.
// Geometry is never duplicated: one 8-byte record describes each cube.
//
// 16-byte header:
//   magic[4]="CUBE", version:u8=1, flags:u8=0, gapPercent:u8=1,
//   recordSize:u8=8, cubeCount:u16, paletteCount:u8, maxTier:u8=4,
//   gridUnit:f32
// palette: RGBA8 x paletteCount
// cube record (8 bytes): gx:i8, gy:i8, gz:i8, size:u8,
//                        palette:u8, part:u8, flags:u8, reserved:u8
function makeCubesBinary(){
  if(!placed.length) return null;
  const colors=[]; const colorIndex=new Map();
  for(const q of placed){
    const k=q.color>>>0;
    if(!colorIndex.has(k)){ colorIndex.set(k,colors.length); colors.push(k); }
    if(q.gx < -128 || q.gx > 127 || q.gy < -128 || q.gy > 127 || q.gz < -128 || q.gz > 127){
      alert('Grid coordinate exceeds compact CUBES v1 i8 range.');
      return null;
    }
  }
  if(colors.length>255){ alert('Too many colors for compact palette.'); return null; }
  if(placed.length>65535){ alert('Too many cubes for compact CUBES v1.'); return null; }

  const headerBytes=16, paletteBytes=colors.length*4, cubeBytes=placed.length*8;
  const out=new ArrayBuffer(headerBytes+paletteBytes+cubeBytes);
  const dv=new DataView(out); let o=0;
  for(const c of [67,85,66,69]) dv.setUint8(o++,c); // CUBE
  dv.setUint8(o++,1); // version
  dv.setUint8(o++,0); // flags: strict grid/static
  dv.setUint8(o++,Math.round(GAP*100));
  dv.setUint8(o++,8); // cube record size
  dv.setUint16(o,placed.length,true); o+=2;
  dv.setUint8(o++,colors.length);
  dv.setUint8(o++,MAX_CUBE_STEP);
  dv.setFloat32(o,GRID_UNIT,true); o+=4;

  for(const c of colors){
    dv.setUint8(o++,(c>>16)&255); dv.setUint8(o++,(c>>8)&255); dv.setUint8(o++,c&255); dv.setUint8(o++,255);
  }
  for(const q of placed){
    dv.setInt8(o++,q.gx); dv.setInt8(o++,q.gy); dv.setInt8(o++,q.gz);
    dv.setUint8(o++,q.tier);
    dv.setUint8(o++,colorIndex.get(q.color>>>0));
    dv.setUint8(o++,PART_IDS.get(q.kind) ?? 0);
    dv.setUint8(o++,0); // flags reserved
    dv.setUint8(o++,0); // reserved
  }
  return out;
}

function downloadCubes(){
  const data=makeCubesBinary(); if(!data) return;
  downloadBlob(new Blob([data],{type:'application/octet-stream'}),`cube_nature_${document.getElementById('preset').value}.cubes`);
}

<!-- ================================================================
     WORLD THEME INSTANCES + PORTAL ADJACENCY + LARGE WORLD VIEW
     Separate display-only logic. Does not alter GLB/CUBES asset export.
     ================================================================ -->
<script type="module">
import * as THREE from 'three';

const WORLD_THEMES = [
  {id:1, name:'Sky',         color:'#63C7F2'},
  {id:2, name:'Underground', color:'#7A4B30'},
  {id:3, name:'black-hole',  color:'#25153D'},
  {id:4, name:'white-hole',  color:'#F4E8A6'},
  {id:5, name:'Island',      color:'#4EAF68'},
  {id:6, name:'City',        color:'#D76567'}
];
const SPECIAL_THEME = {id:'S', name:'void', color:'#D83CFF'};
const LEAVE_PORTAL = {id:'L', name:'leave', color:'#CBD5E1'};
const OPPOSING_PAIRS = [[1,2],[3,4],[5,6]];
const OPPOSING_KEYS = new Set(OPPOSING_PAIRS.map(([a,b]) => `${a}-${b}`));
const themeById = new Map(WORLD_THEMES.map(t => [t.id,t]));
const SIDE_FACES=['north','east','south','west'];
const ALL_FACES=['north','east','south','west','bottom','top'];

// World-view scale only. The old chunk was 40×40 cells; each horizontal
// dimension is now 4× larger while standalone asset previews stay unchanged.
const WORLD_GRID_CELLS=160;
const WORLD_FLOOR_TIER=4; // 4x cubes: same 32x32 footprint, 16x fewer floor cubes
const WORLD_RAMP_WIDTH_TILES=4;  // centered bridge/ramp width, in 4x floor cubes
const WORLD_RAMP_LENGTH_TILES=8; // extension length beyond each horizontal side

// Closed roster: 6 singles + 12 legal duals + 8 legal triples + 1 special = 27.
// Every world also receives a stable zero-based index and [x,y,z] iterator in
// a 3x3x3 Rubik-cube address space. This is intentionally separate from the
// game-design portal topology so later adjacency rules can be authored freely.
function makeWorldRoster(){
  const definitions=[];
  for(const t of WORLD_THEMES) definitions.push({kind:'single',themes:[t.id]});
  for(let a=1;a<=6;a++) for(let b=a+1;b<=6;b++){
    if(!OPPOSING_KEYS.has(`${a}-${b}`)) definitions.push({kind:'dual',themes:[a,b]});
  }
  for(const a of OPPOSING_PAIRS[0])
    for(const b of OPPOSING_PAIRS[1])
      for(const c of OPPOSING_PAIRS[2]) definitions.push({kind:'triple',themes:[a,b,c]});
  definitions.push({kind:'special',themes:['S']});
  return definitions.map((world,index)=>({
    id:index+1,
    index,
    iterator:[index%3,Math.floor(index/3)%3,Math.floor(index/9)],
    ...world,
    faces:Object.fromEntries(ALL_FACES.map(face=>[face,null]))
  }));
}

const WORLDS=makeWorldRoster();
if(WORLDS.length!==27) throw new Error(`Expected 27 worlds, got ${WORLDS.length}`);

function oppositeThemeId(id){
  for(const [a,b] of OPPOSING_PAIRS){
    if(id===a) return b;
    if(id===b) return a;
  }
  return null;
}
function dualWorldFor(a,b){
  return WORLDS.find(w=>w.kind==='dual' && w.themes.includes(a) && w.themes.includes(b));
}
function tripleWorldFor(a,b,c){
  const need=[a,b,c].slice().sort((x,y)=>x-y);
  return WORLDS.find(w=>w.kind==='triple' && w.themes.length===3 && [...w.themes].sort((x,y)=>x-y).every((v,i)=>v===need[i]));
}
function pureWorldFor(themeId){
  return WORLDS.find(w=>w.kind==='single' && w.themes[0]===themeId);
}
function pairIndexForTheme(themeId){
  return OPPOSING_PAIRS.findIndex(pair=>pair.includes(themeId));
}

// Pure-world topology: four horizontal faces lead to all four legal dual
// worlds. The portal color advertises the *new* theme being added. Bottom
// enters Void; top is Leave.
for(const world of WORLDS.filter(w=>w.kind==='single')){
  const here=world.themes[0];
  const opposite=oppositeThemeId(here);
  const compatible=WORLD_THEMES.map(t=>t.id).filter(id=>id!==here && id!==opposite);
  SIDE_FACES.forEach((face,i)=>{
    const other=compatible[i];
    const target=dualWorldFor(here,other);
    world.faces[face]={portalTheme:other,targetWorldId:target.id,action:'world'};
  });
  world.faces.bottom={portalTheme:'S',targetWorldId:27,action:'world'};
  world.faces.top={portalTheme:'L',targetWorldId:null,action:'leave'};
}

// Dual-world topology: every legal pair gets four side portals total.
// North/south return to the two pure worlds; east/west advance to the only
// two compatible triple-theme worlds. For those forward links, the portal
// color advertises the third theme being added.
for(const world of WORLDS.filter(w=>w.kind==='dual')){
  const [themeA,themeB]=world.themes;
  const pureA=pureWorldFor(themeA);
  const pureB=pureWorldFor(themeB);
  world.faces.north={portalTheme:themeA,targetWorldId:pureA.id,action:'world'};
  world.faces.south={portalTheme:themeB,targetWorldId:pureB.id,action:'world'};

  const usedPairs=new Set([pairIndexForTheme(themeA),pairIndexForTheme(themeB)]);
  const missingPair=OPPOSING_PAIRS.find((_,idx)=>!usedPairs.has(idx));
  const [extraA,extraB]=missingPair;
  const tripleA=tripleWorldFor(themeA,themeB,extraA);
  const tripleB=tripleWorldFor(themeA,themeB,extraB);
  world.faces.east={portalTheme:extraA,targetWorldId:tripleA.id,action:'world'};
  world.faces.west={portalTheme:extraB,targetWorldId:tripleB.id,action:'world'};
  // The two remaining cube faces are open exits from the 27-world system.
  world.faces.bottom={portalTheme:'L',targetWorldId:null,action:'leave'};
  world.faces.top={portalTheme:'L',targetWorldId:null,action:'leave'};
}

// Triple-world topology: every 3-theme world exposes exactly three XY-plane
// return portals, one to each constituent dual world. Its three remaining
// faces are filled with the eighth / Leave portal, so every triple world has
// all six conceptual cube faces authored: 3 returns + 3 open exits.
for(const world of WORLDS.filter(w=>w.kind==='triple')){
  const [themeA,themeB,themeC]=world.themes;
  const dualAB=dualWorldFor(themeA,themeB);
  const dualAC=dualWorldFor(themeA,themeC);
  const dualBC=dualWorldFor(themeB,themeC);
  world.faces.north={portalTheme:themeC,targetWorldId:dualAB.id,action:'world'};
  world.faces.east={portalTheme:themeB,targetWorldId:dualAC.id,action:'world'};
  world.faces.south={portalTheme:themeA,targetWorldId:dualBC.id,action:'world'};
  world.faces.west={portalTheme:'L',targetWorldId:null,action:'leave'};
  world.faces.bottom={portalTheme:'L',targetWorldId:null,action:'leave'};
  world.faces.top={portalTheme:'L',targetWorldId:null,action:'leave'};
}

// Void keeps its one actual centered Leave exit. The six outer cube faces are
// visual theme markers only (not portals): each opposing theme pair occupies
// opposite faces, which makes the pure-theme relationship readable in 3D.
const VOID_WORLD=WORLDS.find(w=>w.kind==='special');
VOID_WORLD.centerPortal={portalTheme:'L',targetWorldId:null,action:'leave'};
const VOID_FACE_THEMES={north:1,south:2,east:3,west:4,top:5,bottom:6};

// Topology validation for the authored portal system.
const dualWorlds=WORLDS.filter(w=>w.kind==='dual');
const tripleWorlds=WORLDS.filter(w=>w.kind==='triple');
const dualToTripleCount=dualWorlds.reduce((n,w)=>n+['east','west'].filter(face=>w.faces[face]?.targetWorldId).length,0);
const dualLeaveCount=dualWorlds.reduce((n,w)=>n+['bottom','top'].filter(face=>w.faces[face]?.action==='leave').length,0);
const tripleSideCount=tripleWorlds.reduce((n,w)=>n+SIDE_FACES.filter(face=>w.faces[face]?.targetWorldId).length,0);
const tripleLeaveCount=tripleWorlds.reduce((n,w)=>n+ALL_FACES.filter(face=>w.faces[face]?.action==='leave').length,0);
if(dualToTripleCount!==24) throw new Error(`Expected 24 dual→triple portals, got ${dualToTripleCount}`);
if(dualLeaveCount!==24) throw new Error(`Expected 24 dual leave portals, got ${dualLeaveCount}`);
if(tripleSideCount!==24) throw new Error(`Expected 24 triple return portals, got ${tripleSideCount}`);
if(tripleLeaveCount!==24) throw new Error(`Expected 24 triple leave portals, got ${tripleLeaveCount}`);

let selectedWorldId=1;
let worldViewActive=false;
let worldFloorGroup=null;
let worldPortalGroup=null;
let host=null;
let uiRoot=null;
let portalHitMeshes=[];
let pointerDown=null;

function themeFor(id){
  if(id==='S') return SPECIAL_THEME;
  if(id==='L') return LEAVE_PORTAL;
  return themeById.get(id);
}
function currentWorld(){return WORLDS[selectedWorldId-1]}
function padWorld(id){return String(id).padStart(2,'0')}
function rubikLabel(world){return `i${String(world.index).padStart(2,'0')} · [${world.iterator.join(',')}]`}

function makeChip(themeId){
  const t=themeFor(themeId);
  return `<span class="world-chip"><span class="world-dot" style="background:${t.color}"></span><b>${t.id}</b>${t.name}</span>`;
}

function makeSummary(world){
  const themes=world.themes.map(themeFor);
  return `<span class="world-summary-id">World ${padWorld(world.id)}</span>`+
    `<span class="world-summary-dots">${themes.map(t=>`<span class="world-dot" style="background:${t.color}"></span>`).join('')}</span>`+
    `<span class="world-summary-label">${themes.map(t=>t.name).join(' + ')} · ${rubikLabel(world)}</span>`;
}

function makeFaceMap(world){
  if(world.centerPortal){
    const p=themeFor(world.centerPortal.portalTheme);
    return `<span class="world-face center"><strong>C</strong><span class="world-dot" style="background:${p.color}"></span>${p.name} → leave system</span>`;
  }
  return ALL_FACES.map(face=>{
    const edge=world.faces[face];
    if(!edge) return `<span class="world-face unassigned"><strong>${face[0].toUpperCase()}</strong>unassigned</span>`;
    const mix=portalMixIds(edge).map(themeFor);
    const target=edge.action==='leave' ? 'leave system' : `World ${padWorld(edge.targetWorldId)}`;
    const dots=mix.map(p=>`<span class="world-dot" style="background:${p.color}"></span>`).join('');
    const label=mix.map(p=>p.name).join(' + ');
    return `<span class="world-face"><strong>${face[0].toUpperCase()}</strong>${dots}${label} → ${target}</span>`;
  }).join('');
}

function buildWorldUi(){
  if(document.getElementById('worldThemeUi')) return;

  uiRoot=document.createElement('div');
  uiRoot.id='worldThemeUi';
  const status=document.getElementById('status');
  status.parentElement.insertBefore(uiRoot,status);

  const details=document.createElement('details');
  const summary=document.createElement('summary');
  const panel=document.createElement('div');
  panel.className='world-picker-panel';
  details.append(summary,panel);
  uiRoot.append(details);

  const pairLabel=OPPOSING_PAIRS.map(([a,b])=>`${a} ${themeFor(a).name} ↔ ${b} ${themeFor(b).name}`).join(' &nbsp; · &nbsp; ');
  panel.innerHTML=`<div class="world-pair-note"><strong>3×3×3 roster:</strong> stable index 0–26 + iterator [x,y,z].<br><strong>Opposing pairs:</strong> ${pairLabel}<br>Portal appearance is destination-driven: 1-theme, 2-theme and 3-theme mixes use the same territory logic as the world floor; Void is magenta and Leave is neutral generic.<br>Side portals use the grounded Standing form; top/bottom portals use the floating Circle form.<br>Pure worlds: 4 side portals to legal dual worlds, bottom → void, top → leave.<br>Dual worlds: 4 XY portals (2 pure returns + 2 triple forwards), plus top + bottom Leave portals.<br>Triple worlds: 3 return portals to their dual worlds + 3 open Leave portals on the unused faces.<br>Void keeps one centered Leave exit; its six outer faces show the six pure-theme colors as non-clickable markers.</div><div class="world-face-map" id="worldFaceMap"></div>`;

  let lastKind='';
  for(const world of WORLDS){
    if(world.kind!==lastKind){
      const section=document.createElement('div');
      section.className='world-section';
      section.textContent=world.kind==='single' ? '6 single-theme worlds' : world.kind==='dual' ? '12 dual-theme worlds' : world.kind==='triple' ? '8 triple-theme worlds' : '1 special world';
      panel.append(section);
      lastKind=world.kind;
    }

    const row=document.createElement('button');
    row.type='button';
    row.className='world-row';
    row.dataset.worldId=world.id;
    row.innerHTML=`<span class="world-id">${padWorld(world.id)}</span><span class="world-kind">${world.kind}</span><span class="world-rubik">${rubikLabel(world)}</span><span class="world-theme-list">${world.themes.map(makeChip).join('')}</span>`;
    row.addEventListener('click',()=>selectWorld(world.id,{closePicker:true}));
    panel.append(row);
  }

  details.addEventListener('toggle',()=>{if(details.open) updateWorldUi()});
  document.addEventListener('pointerdown',(e)=>{
    if(details.open && !details.contains(e.target)) details.open=false;
  });
  updateWorldUi();
}

function updateWorldUi(){
  if(!uiRoot) return;
  const world=currentWorld();
  const summary=uiRoot.querySelector('summary');
  if(summary) summary.innerHTML=makeSummary(world);
  const faceMap=uiRoot.querySelector('#worldFaceMap');
  if(faceMap) faceMap.innerHTML=makeFaceMap(world);
  for(const row of uiRoot.querySelectorAll('.world-row')){
    row.classList.toggle('active',Number(row.dataset.worldId)===world.id);
  }
}

function selectWorld(worldId,{closePicker=false}={}){
  const next=WORLDS.find(w=>w.id===Number(worldId));
  if(!next) return;
  selectedWorldId=next.id;
  updateWorldUi();
  enterWorldView();
  if(closePicker && uiRoot){
    const details=uiRoot.querySelector('details');
    if(details) details.open=false;
  }
}

// Stable tiny hash for boundary texture; independent of the asset's random seed.
function cellNoise(x,z,worldId){
  let n=Math.imul(Math.floor(x)+97,374761393)^Math.imul(Math.floor(z)-53,668265263)^Math.imul(worldId,1442695041);
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}

function mixedThemeIndex(x,z,count,seed){
  if(count<=1) return 0;
  if(count===2){
    const wobble=2.8*Math.sin(z*0.26+seed*0.7)+(cellNoise(x,z,seed)-0.5)*2.6;
    return x+z*0.18+wobble<0 ? 0 : 1;
  }
  const angleOffset=(seed*0.73)%(Math.PI*2);
  const jitter=(cellNoise(x,z,seed)-0.5)*0.34;
  let angle=Math.atan2(z,x)+Math.PI+angleOffset+jitter;
  angle=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  return Math.min(2,Math.floor(angle/(Math.PI*2/3)));
}
function themeIndexForCell(x,z,world){
  return mixedThemeIndex(x,z,world.themes.length,world.id);
}

function clearGroup(group){
  if(!group) return;
  for(const child of [...group.children]){
    group.remove(child);
    child.traverse?.(obj=>{
      if(obj.material){
        if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
        else obj.material.dispose();
      }
      if(obj.userData?.disposeGeometry && obj.geometry) obj.geometry.dispose();
    });
  }
}

function renderWorldFloor(){
  if(!host) return;
  const geometry=host.getCubeGeometry();
  if(!geometry) return;

  if(!worldFloorGroup){
    worldFloorGroup=new THREE.Group();
    worldFloorGroup.name='WorldThemeChunk_DisplayOnly';
    host.scene.add(worldFloorGroup);
  }
  clearGroup(worldFloorGroup);

  const world=currentWorld();
  const unit=host.gridUnit;
  const tier=WORLD_FLOOR_TIER;
  const renderSide=Math.max(0.001,tier*unit-host.gapWorld);
  const gridCells=WORLD_GRID_CELLS;
  const tileCount=gridCells/tier;
  const half=gridCells/2;
  const buckets=new Map(world.themes.map(id=>[id,[]]));

  const addFloorTile=(gx,gz)=>{
    const idx=themeIndexForCell(gx+tier/2,gz+tier/2,world);
    buckets.get(world.themes[idx]).push([gx,gz]);
  };

  // Each floor instance occupies a 4x4 patch of the original 1x grid.
  // Sampling the theme at the larger cube center preserves the same broad
  // territory layout while reducing the plane from 25,600 to 1,600 cubes.
  for(let zi=0;zi<tileCount;zi++) for(let xi=0;xi<tileCount;xi++){
    const gx=xi*tier-half;
    const gz=zi*tier-half;
    addFloorTile(gx,gz);
  }

  // Centered 4x8 large-cube ramps extend the planar world on each horizontal
  // side that owns a standing portal. They use the exact same theme mixing
  // function as the core floor, so their colors naturally continue the world.
  const rampWidthStart=-Math.floor(WORLD_RAMP_WIDTH_TILES/2)*tier;
  for(const face of SIDE_FACES){
    if(!world.faces[face]) continue; // Void has no horizontal portal ramps.
    for(let lengthIndex=0;lengthIndex<WORLD_RAMP_LENGTH_TILES;lengthIndex++){
      for(let widthIndex=0;widthIndex<WORLD_RAMP_WIDTH_TILES;widthIndex++){
        const lateral=rampWidthStart+widthIndex*tier;
        const outward=(lengthIndex+1)*tier;
        if(face==='north') addFloorTile(lateral,-half-outward);
        else if(face==='south') addFloorTile(lateral,half+(outward-tier));
        else if(face==='east') addFloorTile(half+(outward-tier),lateral);
        else if(face==='west') addFloorTile(-half-outward,lateral);
      }
    }
  }

  const matrix=new THREE.Matrix4();
  const quat=new THREE.Quaternion();
  const scale=new THREE.Vector3(renderSide,renderSide,renderSide);
  for(const themeId of world.themes){
    const t=themeFor(themeId);
    const cells=buckets.get(themeId);
    const material=new THREE.MeshStandardMaterial({color:t.color,roughness:0.9,metalness:0,flatShading:true});
    const mesh=new THREE.InstancedMesh(geometry,material,cells.length);
    mesh.name=`WorldTheme_${t.name}`;
    mesh.receiveShadow=true;

    for(let i=0;i<cells.length;i++){
      const [gx,gz]=cells[i];
      const pos=new THREE.Vector3((gx+tier/2)*unit,0,(gz+tier/2)*unit);
      matrix.compose(pos,quat,scale);
      mesh.setMatrixAt(i,matrix);
    }
    mesh.instanceMatrix.needsUpdate=true;
    mesh.userData={displayOnly:true,worldId:world.id,themeId:t.id,themeName:t.name,themeColor:t.color,sizeTier:tier};
    worldFloorGroup.add(mesh);
  }

  // No neutral opaque floor is rendered; the wireframe and cube chunk are the
  // complete world-view spatial reference.
}

function portalCellsForMode(mode){
  const cells=[];
  if(mode==='circle'){
    for(let y=-8;y<=8;y++) for(let x=-8;x<=8;x++){
      const r2=(x/7.6)**2+(y/7.6)**2;
      const inner=(x/4.8)**2+(y/4.8)**2<1;
      if(r2>1.02 || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y,accent:z===0 && Math.abs(r2-1)<0.24});
    }
  }else{
    const cy=10;
    for(let y=2;y<=18;y++) for(let x=-8;x<=8;x++){
      const outer=(x/7.7)**2+((y-cy)/8.1)**2<=1.03;
      const inner=(x/4.8)**2+((y-cy)/5.2)**2<1;
      if(!outer || inner) continue;
      for(const z of [-1,0]) cells.push({x,y,z,u:x,v:y-cy,accent:z===0 && ((Math.abs(x)>=6)||(y>=16))});
    }
    for(const sx of [-1,1]){
      for(let y=0;y<=3;y++) for(let x=(sx<0?-7:5);x<=(sx<0?-5:7);x++) for(const z of [-1,0]){
        cells.push({x,y,z,u:x,v:y-cy,accent:y===0});
      }
    }
  }
  const seen=new Set();
  return cells.filter(c=>{const k=`${c.x},${c.y},${c.z}`;if(seen.has(k))return false;seen.add(k);return true;});
}
const WORLD_PORTAL_CELLS={standing:portalCellsForMode('standing'),circle:portalCellsForMode('circle')};

function portalMixIds(edge){
  if(edge.action==='leave') return ['L'];
  if(edge.targetWorldId){
    const target=WORLDS[edge.targetWorldId-1];
    if(target) return [...target.themes];
  }
  return [edge.portalTheme ?? 'L'];
}
function portalModeForFace(face){
  return (face==='top' || face==='bottom') ? 'circle' : 'standing';
}
function portalThemeColor(themeId,accent=false){
  const base=new THREE.Color(themeFor(themeId).color);
  if(accent) base.lerp(new THREE.Color(0xffffff),themeId==='L'?0.50:0.30);
  return base;
}
function portalMixSeed(edge,face){
  const mix=portalMixIds(edge);
  let seed=(edge.targetWorldId||0)*37+(face.charCodeAt(0)||0)*11;
  for(const id of mix) seed+=typeof id==='number'?id*17:id==='S'?97:131;
  return seed;
}
function addMixedPortalCells(parent,cells,mixIds,edge,face){
  const geometry=host.getCubeGeometry();
  const unit=host.gridUnit;
  const renderSide=Math.max(0.001,unit-host.gapWorld);
  const seed=portalMixSeed(edge,face);
  const buckets=new Map();
  for(const cell of cells){
    const idx=mixedThemeIndex(cell.u,cell.v,mixIds.length,seed);
    const themeId=mixIds[idx];
    const key=`${themeId}|${cell.accent?1:0}`;
    if(!buckets.has(key)) buckets.set(key,{themeId,accent:cell.accent,cells:[]});
    buckets.get(key).cells.push(cell);
  }
  const matrix=new THREE.Matrix4();
  const quat=new THREE.Quaternion();
  const scale=new THREE.Vector3(renderSide,renderSide,renderSide);
  for(const bucket of buckets.values()){
    const color=portalThemeColor(bucket.themeId,bucket.accent);
    const material=new THREE.MeshStandardMaterial({color,roughness:0.62,metalness:0.08,flatShading:true,emissive:color,emissiveIntensity:0.08});
    const mesh=new THREE.InstancedMesh(geometry,material,bucket.cells.length);
    for(let i=0;i<bucket.cells.length;i++){
      const c=bucket.cells[i];
      const pos=new THREE.Vector3((c.x+0.5)*unit,(c.y+0.5)*unit,(c.z+0.5)*unit);
      matrix.compose(pos,quat,scale);
      mesh.setMatrixAt(i,matrix);
    }
    mesh.instanceMatrix.needsUpdate=true;
    mesh.castShadow=mesh.receiveShadow=true;
    mesh.userData={displayOnly:true,dynamicPortal:true,themeId:bucket.themeId,accent:bucket.accent};
    parent.add(mesh);
  }
}

function addPortal(face,edge){
  if(!edge) return;
  const unit=host.gridUnit;
  const chunkTop=0.5*WORLD_FLOOR_TIER*unit;
  const worldHalf=WORLD_GRID_CELLS*unit*0.5;
  const renderSide=Math.max(0.001,unit-host.gapWorld);
  const portalHalfThickness=0.5*unit+0.5*renderSide;
  const mode=portalModeForFace(face);
  const circleShell=worldHalf-portalHalfThickness;
  const rampLength=WORLD_RAMP_LENGTH_TILES*WORLD_FLOOR_TIER*unit;
  // Standing side portals move outward by exactly the 8-tile ramp length.
  // Floating circular top/bottom portals keep their existing cube-shell radius.
  const standingShell=worldHalf+rampLength-portalHalfThickness;
  const portalShell=mode==='standing' ? standingShell : circleShell;
  const group=new THREE.Group();
  const mixIds=portalMixIds(edge);
  group.name=`WorldPortal_${face}_${mode}`;
  group.userData={displayOnly:true,face,mode,portalThemes:mixIds,...edge};

  if(face==='north') group.position.set(-0.5*unit,chunkTop,-portalShell);
  if(face==='east'){group.position.set(portalShell,chunkTop,-0.5*unit);group.rotation.y=-Math.PI/2;}
  if(face==='south'){group.position.set(0.5*unit,chunkTop,portalShell);group.rotation.y=Math.PI;}
  if(face==='west'){group.position.set(-portalShell,chunkTop,0.5*unit);group.rotation.y=Math.PI/2;}
  if(face==='top'){group.position.set(-0.5*unit,portalShell,0);group.rotation.x=-Math.PI/2;}
  if(face==='bottom'){group.position.set(-0.5*unit,-portalShell,0);group.rotation.x=Math.PI/2;}
  if(face==='center') group.position.set(-0.5*unit,chunkTop,0);

  addMixedPortalCells(group,WORLD_PORTAL_CELLS[mode],mixIds,edge,face);

  // Click volume follows the same local portal plane. Standing gets a tall
  // oval box; Circle gets a compact square box, with group rotation handling
  // top/bottom orientation automatically.
  const hitGeometry=mode==='circle'
    ? new THREE.BoxGeometry(17*unit,17*unit,3*unit)
    : new THREE.BoxGeometry(17*unit,19*unit,3*unit);
  const hitMaterial=new THREE.MeshBasicMaterial({transparent:true,opacity:0.001,depthWrite:false,colorWrite:false});
  const hit=new THREE.Mesh(hitGeometry,hitMaterial);
  hit.userData={worldPortalHit:true,face,mode,portalThemes:mixIds,...edge,disposeGeometry:true};
  if(mode==='standing') hit.position.y=9.5*unit;
  group.add(hit);
  portalHitMeshes.push(hit);
  worldPortalGroup.add(group);
}

function addVoidThemeFace(face,themeId){
  if(!worldPortalGroup || !host?.scene) return;
  const unit=host.gridUnit;
  const worldHalf=WORLD_GRID_CELLS*unit*0.5;
  const inset=0.035;
  const size=8.5;
  const t=themeFor(themeId);
  const geometry=new THREE.PlaneGeometry(size,size);
  const material=new THREE.MeshBasicMaterial({
    color:t.color,
    transparent:true,
    opacity:0.34,
    side:THREE.DoubleSide,
    depthWrite:false
  });
  const panel=new THREE.Mesh(geometry,material);
  panel.name=`VoidFace_${face}_${t.name}`;
  panel.userData={displayOnly:true,voidThemeFace:true,face,themeId,themeName:t.name,disposeGeometry:true};

  if(face==='north'){
    panel.position.set(0,0,-worldHalf+inset);
  }else if(face==='south'){
    panel.position.set(0,0,worldHalf-inset);
    panel.rotation.y=Math.PI;
  }else if(face==='east'){
    panel.position.set(worldHalf-inset,0,0);
    panel.rotation.y=-Math.PI/2;
  }else if(face==='west'){
    panel.position.set(-worldHalf+inset,0,0);
    panel.rotation.y=Math.PI/2;
  }else if(face==='top'){
    panel.position.set(0,worldHalf-inset,0);
    panel.rotation.x=-Math.PI/2;
  }else if(face==='bottom'){
    panel.position.set(0,-worldHalf+inset,0);
    panel.rotation.x=Math.PI/2;
  }
  worldPortalGroup.add(panel);
}

function renderVoidThemeFaces(){
  for(const face of ALL_FACES) addVoidThemeFace(face,VOID_FACE_THEMES[face]);
}

function renderWorldPortals(){
  if(!host || !host.getCubeGeometry()) return;
  if(!worldPortalGroup){
    worldPortalGroup=new THREE.Group();
    worldPortalGroup.name='WorldPortals_DisplayOnly';
    host.scene.add(worldPortalGroup);
  }
  clearGroup(worldPortalGroup);
  portalHitMeshes=[];

  const world=currentWorld();
  if(world.centerPortal){
    renderVoidThemeFaces();
    addPortal('center',world.centerPortal);
    return;
  }
  for(const face of ALL_FACES) addPortal(face,world.faces[face]);
}

function setWorldDisplayVisible(visible){
  if(worldFloorGroup) worldFloorGroup.visible=!!visible;
  if(worldPortalGroup) worldPortalGroup.visible=!!visible;
}

function updateWorldStatus(){
  const status=document.getElementById('status');
  if(!status) return;
  const world=currentWorld();
  const names=world.themes.map(id=>themeFor(id).name).join(' + ');
  const assigned=ALL_FACES.filter(face=>world.faces[face]).length+(world.centerPortal?1:0);
  const suffix=world.kind==='special' ? ` · 6 pure-theme face colors + ${assigned} exit` : ` · ${assigned} assigned face${assigned===1?'':'s'}`;
  status.textContent=`world ${padWorld(world.id)} · ${world.kind} · ${names} · world view${suffix}`;
}

function frameWorldScene(){
  if(!host?.controls || !host?.camera) return;
  host.controls.target.set(0,0.9,0);
  // Pull back only in World Selector mode so the 32×32 core, four 4×8 ramp
  // extensions, and their outward-shifted standing portals are visible together.
  // Asset framing is untouched.
  host.camera.position.set(36.5,26.5,40.5);
  host.camera.near=0.05;
  host.camera.far=180;
  host.camera.updateProjectionMatrix();
  host.controls.update();
}

function enterWorldView(){
  if(!host) return;
  worldViewActive=true;
  // World Selector mode is contextual only: never render the standalone asset
  // from the first combobox together with the world chunk or its portals.
  host.setAssetVisible?.(false);
  renderWorldScene();
  setWorldDisplayVisible(true);
  updateWorldStatus();
  frameWorldScene();
}

function enterAssetView(){
  worldViewActive=false;
  setWorldDisplayVisible(false);
  host?.setAssetVisible?.(true);
  if(host?.grid) host.grid.position.y=0;
  const canvas=host?.renderer?.domElement;
  if(canvas) canvas.style.cursor='';
}

function renderWorldScene(){
  if(!worldViewActive) return;
  renderWorldFloor();
  renderWorldPortals();
}

function raycastPortal(event){
  if(!worldViewActive || !host?.renderer || !host?.camera || portalHitMeshes.length===0) return null;
  const rect=host.renderer.domElement.getBoundingClientRect();
  const mouse=new THREE.Vector2(
    ((event.clientX-rect.left)/rect.width)*2-1,
    -((event.clientY-rect.top)/rect.height)*2+1
  );
  const raycaster=new THREE.Raycaster();
  raycaster.setFromCamera(mouse,host.camera);
  return raycaster.intersectObjects(portalHitMeshes,false)[0]?.object || null;
}

function attachPortalInteraction(){
  const canvas=host.renderer?.domElement;
  if(!canvas || canvas.dataset.worldPortalClicks==='1') return;
  canvas.dataset.worldPortalClicks='1';
  canvas.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY};});
  canvas.addEventListener('pointerup',e=>{
    if(!pointerDown) return;
    const moved=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y);
    pointerDown=null;
    if(moved>5) return;
    const hit=raycastPortal(e);
    if(!hit) return;
    if(hit.userData.action==='leave'){
      const status=document.getElementById('status');
      if(status) status.textContent='leave portal · visual only · exits the 27-world system (no action assigned)';
      return;
    }
    if(hit.userData.targetWorldId) selectWorld(hit.userData.targetWorldId);
  });
  canvas.addEventListener('pointermove',e=>{
    if(pointerDown) return;
    canvas.style.cursor=raycastPortal(e)?'pointer':'';
  });
  canvas.addEventListener('pointerleave',()=>{canvas.style.cursor='';pointerDown=null;});
}

function attachWorldThemeModule(){
  host=window.CUBE_NATURE_THEME_HOST;
  if(!host) return;
  buildWorldUi();
  attachPortalInteraction();

  // Startup remains the original standalone asset preview. World geometry is
  // created only after the user actually selects a world row.
  enterAssetView();
  window.addEventListener('cube-nature-geometry-ready',()=>{
    if(worldViewActive) renderWorldScene();
  });
  window.addEventListener('cube-nature-view-mode',(event)=>{
    if(event.detail?.mode==='asset') enterAssetView();
  });
}

if(window.CUBE_NATURE_THEME_HOST) attachWorldThemeModule();
else window.addEventListener('cube-nature-theme-host-ready',attachWorldThemeModule,{once:true});
</script>
